version: "3.8"

services:
  # Next.js Frontend (Bun-based)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ejournal-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  # FastAPI Backend (uv-based)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ejournal-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      - redis

  # Redis Container for Cache and Queue Messaging (RULE-INF06)
  redis:
    image: redis:7-alpine
    container_name: ejournal-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Nginx Gateway Reverse Proxy (RULE-INF03, RULE-SEC11)
  nginx:
    image: nginx:alpine
    container_name: ejournal-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend

volumes:
  redis_data:
  nginx_logs:
